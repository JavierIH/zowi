; IronZowi firmware. Board: BQ ZUM BT-328, Arduino framework.
; The Oscillator library comes from the ArduSnake submodule (firmware/external/ArduSnake).
;   pio run              build
;   pio run -t upload    build and upload

[env:zumbt328]
platform = atmelavr
board = zumbt328
framework = arduino
lib_deps = arduino-libraries/Servo@^1.2.1
lib_extra_dirs = ../../../firmware/external/ArduSnake
