; Zowi firmware: Zowi library (lib/), example sketches (examples/) and the ArduSnake
; Oscillator library as a git submodule (external/ArduSnake, run `git submodule update --init`).
;
; Board: BQ ZUM BT-328 (ATmega328P, 16 MHz), Arduino framework.
; Each environment builds one Arduino sketch folder, selected with `custom_sketch`:
;   pio run                    build every sketch
;   pio run -e calibration     build one sketch
;   pio run -e calibration -t upload

[env]
platform = atmelavr
board = zumbt328
framework = arduino
lib_deps = arduino-libraries/Servo@^1.2.1
lib_extra_dirs = external/ArduSnake
extra_scripts = pre:tools/sketch_dir.py

[env:calibration]
custom_sketch = examples/calibration

[env:Oscillator_test1]
custom_sketch = examples/Oscillator_test1

[env:proto]
custom_sketch = examples/proto

[env:smooth_criminal]
custom_sketch = examples/smooth_criminal

[env:zowi_walk]
custom_sketch = lib/Zowi/examples/zowi_walk
